server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（Vite 产物带 contenthash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 水墨壁纸（public/washpaintingstyle/，若镜像包含则启用长缓存）
    location /washpaintingstyle/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后端反代：前端构建为相对 /api 基址，此处转发到集群内后端 ClusterIP
    # 尾斜杠 + 去前缀：/api/auth/login → /auth/login（与 vite 开发代理 rewrite 一致）
    # 后端 Service 名与端口按实际集群部署调整
    location /api/ {
        proxy_pass http://strategy-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA history 路由兜底：非真实文件全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
